spring.application.name=tradehub

# Default profile for local development (H2 in-memory).
# Use SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod) to run against MySQL.
spring.profiles.active=dev

server.port=8080

jwt.secret=${JWT_SECRET:default_dev_secret_key_that_is_long_enough_32_chars}
jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health,info
